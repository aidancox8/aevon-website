<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aevon | Custom Business Apps for Lower Mainland SMBs</title>
  <meta name="description" content="Aevon builds custom software for small and mid-sized businesses in the Lower Mainland. No subscriptions, no workarounds — software built exactly for how your team works." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='18' fill='white'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #0E0C18;
      --bg2:   #0E0C18;
      --bg3:   #0E0C18;
      --bg4:   #0E0C18;
      --border:  rgba(99,102,241,0.12);
      --border2: rgba(99,102,241,0.28);
      --accent:  #6366F1;
      --accent2: #7C3AED;
      --aglow:   rgba(99,102,241,0.25);
      --adim:    rgba(99,102,241,0.1);
      --text:    #F8FAFC;
      --text2:   #B4C2D0;
      --text3:   #8A9DB5;
      --text4:   #4E6070;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Noise grain overlay — makes the dark bg feel textured not flat */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/feTurbulence%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
    ::selection { background: rgba(99,102,241,0.22); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.25); border-radius: 2px; }

    /* Range input global style */
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.07); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      border: 2px solid var(--bg); box-shadow: 0 0 12px rgba(99,102,241,0.5);
    }
    input[type=range]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
    }

    /* Scroll fade */
    .fi { opacity: 0; transform: translateY(22px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .fi.vis { opacity: 1; transform: none; }

    /* Layout */
    .container { max-width: 1120px; margin: 0 auto; padding: 0 40px; }

    /* Section typography */
    .sec-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    }
    .sec-label::before { content: ''; width: 20px; height: 1px; background: var(--accent); flex-shrink: 0; }
    .sec-label.center { justify-content: center; }
    .sec-label.center::before { display: none; }
    .sec-title {
      font-size: clamp(28px, 3.5vw, 46px); font-weight: 800;
      letter-spacing: -0.038em; line-height: 1.1; margin-bottom: 18px; text-wrap: balance;
    }
    .sec-sub { font-size: 17px; color: var(--text2); line-height: 1.72; text-wrap: balance; }

    /* ── PROGRESS BAR ── */
    #pbar {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 300; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 8px rgba(99,102,241,0.5);
      transition: width 0.08s linear;
    }

    /* ── NAV ── */
    #main-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      transition: background 0.3s, border-color 0.3s, backdrop-filter 0.3s;
      border-bottom: 1px solid transparent;
    }
    #main-nav.scrolled {
      background: rgba(9,9,11,0.82); backdrop-filter: blur(20px);
      border-color: var(--border);
    }
    .nav-logo { display: flex; align-items: center; gap: 9px; font-size: 16.5px; font-weight: 750; letter-spacing: -0.04em; text-decoration: none; color: var(--text); }
    .nav-logo-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
    }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-links a { color: var(--text2); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: color 0.2s; letter-spacing: -0.01em; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      background: var(--accent) !important; color: #fff !important;
      padding: 8px 18px; border-radius: 7px; font-size: 13px !important; font-weight: 600 !important;
      box-shadow: 0 0 20px rgba(99,102,241,0.3); white-space: nowrap;
      transition: opacity 0.2s !important;
    }
    .nav-cta:hover { opacity: 0.85; }

    /* ── HERO ── */
    .hero {
      min-height: 100vh; padding: 136px 40px 90px;
      display: flex; align-items: center;
      position: relative; overflow: hidden;
    }
    .hero-mesh {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 90% 80% at 50% -5%, rgba(99,102,241,0.45) 0%, transparent 62%),
        radial-gradient(ellipse 55% 50% at 92% 85%, rgba(124,58,237,0.18) 0%, transparent 58%);
    }
    .hero-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 85% 75% at 50% 30%, black 15%, transparent 100%);
    }
    .hero-inner {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: center;
      max-width: 1120px; margin: 0 auto; width: 100%;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25);
      border-radius: 100px; padding: 5px 14px 5px 10px;
      font-size: 11.5px; font-weight: 600; color: #a5b4fc;
      letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 26px;
    }
    .badge-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bpulse 2s infinite; }
    @keyframes bpulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .hero h1 {
      font-size: clamp(48px, 6.5vw, 88px); font-weight: 800;
      line-height: 1.04; letter-spacing: -0.045em; margin-bottom: 24px; text-wrap: balance;
      position: relative; z-index: 1; isolation: isolate;
    }
    .hero h1 .grad {
      background: linear-gradient(130deg, #a5b4fc 0%, #c4b5fd 55%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      display: inline;
    }
    .hero-sub { font-size: 17px; color: var(--text2); line-height: 1.72; margin-bottom: 36px; max-width: 460px; text-wrap: balance; }
    .hero-ctas { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; margin-bottom: 20px; }
    .btn-pri {
      background: var(--accent); color: #fff; border: none;
      padding: 13px 26px; border-radius: 8px; font-size: 14.5px; font-weight: 600;
      font-family: 'Inter', sans-serif; letter-spacing: -0.01em; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 0 32px rgba(99,102,241,0.38);
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-pri:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 40px rgba(99,102,241,0.52); }
    .btn-sec {
      background: transparent; color: var(--text2);
      border: 1px solid rgba(255,255,255,0.1); padding: 13px 26px; border-radius: 8px;
      font-size: 14.5px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      letter-spacing: -0.01em; transition: all 0.2s;
    }
    .btn-sec:hover { background: rgba(255,255,255,0.05); color: var(--text); border-color: rgba(255,255,255,0.18); }
    .hero-trust { font-size: 12.5px; color: var(--text4); letter-spacing: 0.01em; }

    /* ── HERO DASHBOARD ── */
    .dash-wrap {
      transform: perspective(1100px) rotateY(-8deg) rotateX(3deg);
      transform-style: preserve-3d; transition: transform 0.6s ease;
    }
    .dash-wrap:hover { transform: perspective(1100px) rotateY(-4deg) rotateX(1deg); }
    .dashboard {
      background: var(--bg2); border: 1px solid rgba(99,102,241,0.2);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .db-chrome {
      background: var(--bg3); border-bottom: 1px solid var(--border);
      padding: 11px 18px; display: flex; align-items: center; gap: 8px;
    }
    .db-dots { display: flex; gap: 6px; }
    .db-dot { width: 10px; height: 10px; border-radius: 50%; }
    .db-body { padding: 18px; }
    .db-metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-bottom: 13px; }
    .db-metric {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 9px; padding: 13px;
    }
    .db-ml { font-size: 9.5px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; }
    .db-mv { font-size: 21px; font-weight: 800; letter-spacing: -0.04em; }
    .db-md { font-size: 9.5px; color: #4ade80; font-weight: 600; margin-top: 2px; }
    .db-chart { background: var(--bg3); border: 1px solid var(--border); border-radius: 9px; padding: 13px; margin-bottom: 13px; }
    .db-cl { font-size: 9.5px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
    .db-bars { display: flex; align-items: flex-end; gap: 5px; height: 50px; }
    .db-bar {
      flex: 1; border-radius: 3px 3px 0 0;
      background: linear-gradient(to top, var(--accent), var(--accent2)); opacity: 0.7;
      animation: bgrow 0.7s ease forwards; transform-origin: bottom;
    }
    .db-bar.hi { opacity: 1; box-shadow: 0 0 10px rgba(99,102,241,0.4); }
    @keyframes bgrow { from{transform:scaleY(0)} to{transform:scaleY(1)} }
    .db-feed { display: flex; flex-direction: column; gap: 6px; }
    .db-fi {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 7px; padding: 9px 11px;
      display: flex; align-items: center; gap: 9px; font-size: 11px;
    }
    .db-fi-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .db-fi-text { color: var(--text2); flex: 1; }
    .db-fi-time { color: var(--text3); font-size: 10px; }
    .db-live {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2);
      border-radius: 100px; padding: 3px 9px;
      font-size: 10px; font-weight: 700; color: #4ade80; letter-spacing: 0.04em;
    }
    .db-live-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; animation: bpulse 1.5s infinite; }
    .db-notif {
      position: absolute; bottom: -14px; right: -18px;
      background: var(--bg3); border: 1px solid rgba(99,102,241,0.3);
      border-radius: 11px; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; min-width: 198px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.5);
      animation: floatn 3.5s ease-in-out infinite;
    }
    @keyframes floatn { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .db-ni { width: 32px; height: 32px; border-radius: 8px; background: var(--adim); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

    /* ── PROBLEM ── */
    .problem { border-top: 1px solid var(--border); }
    .problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 96px; align-items: center; }
    .prob-list { margin-top: 32px; }
    .prob-item {
      display: flex; gap: 18px; padding: 18px 0;
      border-bottom: 1px solid var(--border); align-items: flex-start;
    }
    .prob-item:last-child { border-bottom: none; }
    .prob-n { font-size: 10.5px; font-weight: 700; color: var(--accent); letter-spacing: 0.07em; padding-top: 3px; flex-shrink: 0; width: 22px; }
    .prob-item h4 { font-size: 14.5px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 4px; }
    .prob-item p { font-size: 13.5px; color: var(--text2); line-height: 1.65; }
    /* Terminal */
    .terminal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .term-chrome { background: var(--bg3); border-bottom: 1px solid var(--border); padding: 11px 17px; display: flex; align-items: center; gap: 7px; }
    .term-dots { display: flex; gap: 5px; }
    .term-dot { width: 10px; height: 10px; border-radius: 50%; }
    .term-name { font-size: 11.5px; color: var(--text3); margin-left: 7px; font-weight: 500; }
    .term-body { padding: 20px; font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; line-height: 2; }
    .tl { display: flex; gap: 9px; }
    .tp { color: var(--accent); opacity: 0.7; flex-shrink: 0; }
    .tc { color: #c4b5fd; }
    .to { color: var(--text2); padding-left: 18px; }
    .te { color: #f87171; padding-left: 18px; }
    .tok { color: #4ade80; padding-left: 18px; }
    .tcur { display: inline-block; width: 7px; height: 13px; background: var(--accent); animation: tblink 1s infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes tblink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes bdot { 0%,80%,100%{opacity:0;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

    /* ── SERVICES ── */
    .services { background-color: var(--bg); }
    .svc-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 15px; }
    .svc-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 30px 28px; position: relative; overflow: hidden;
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s; cursor: default;
    }
    .svc-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.5), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .svc-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    .svc-card:hover::before { opacity: 1; }
    .svc-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
    .svc-tag::before { content: ''; display: block; width: 14px; height: 1px; background: var(--accent); }
    .svc-card h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 11px; }
    .svc-card p { font-size: 13.5px; color: var(--text2); line-height: 1.7; margin-bottom: 18px; }
    .svc-feats { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .svc-feats li { font-size: 12.5px; color: var(--text2); display: flex; align-items: center; gap: 7px; }
    .svc-feats li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* ── HOW ── */
    .how { border-top: 1px solid var(--border); }
    .how-steps { display: grid; grid-template-columns: repeat(4,1fr); gap: 24px; position: relative; }
    .how-steps::before {
      content: ''; position: absolute;
      top: 26px; left: calc(12.5% + 26px); right: calc(12.5% + 26px);
      height: 1px; background: linear-gradient(90deg, var(--border2), rgba(99,102,241,0.06), var(--border2));
    }
    .how-step { padding: 0 8px; text-align: center; }
    .step-ring {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; position: relative; z-index: 1;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .step-ring:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(99,102,241,0.3); }
    .step-ring span { font-size: 13px; font-weight: 700; color: var(--accent); }
    .how-step h3 { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 8px; }
    .how-step p { font-size: 13px; color: var(--text2); line-height: 1.65; }
    .step-time { display: inline-block; margin-top: 12px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--adim); border: 1px solid var(--border); padding: 3px 10px; border-radius: 100px; letter-spacing: 0.03em; }

    /* ── CONTACT ── */
    .contact { border-top: 1px solid var(--border); }
    .contact-inner { max-width: 600px; margin: 0 auto; }
    .cform {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .cform-chrome {
      background: var(--bg3); border-bottom: 1px solid var(--border);
      padding: 13px 20px; display: flex; align-items: center; gap: 10px;
    }
    .cform-dots { display: flex; gap: 6px; }
    .cform-dot { width: 10px; height: 10px; border-radius: 50%; }
    .cform-title { font-size: 11.5px; color: var(--text3); font-weight: 500; margin-left: 4px; }
    .cform-body { padding: 30px; }
    .cf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .cf-group { margin-bottom: 13px; }
    .cf-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px; }
    .cf-group input, .cf-group select, .cf-group textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; padding: 11px 13px; font-size: 14px; font-family: 'Inter',sans-serif;
      color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .cf-group input::placeholder, .cf-group textarea::placeholder { color: #64748B; }
    .cf-group input:focus, .cf-group select:focus, .cf-group textarea:focus {
      background: rgba(255,255,255,0.07);
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .cf-group select { appearance: none; cursor: pointer; }
    .cf-group select option { background: var(--bg2); }
    .cf-group textarea { resize: vertical; min-height: 88px; }
    .cf-err { border-color: rgba(248,113,113,0.5) !important; }
    .cf-submit {
      width: 100%; background: var(--accent); color: #fff; border: none;
      padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600;
      font-family: 'Inter',sans-serif; letter-spacing: -0.01em; cursor: pointer;
      box-shadow: 0 0 28px rgba(99,102,241,0.35); margin-top: 4px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .cf-submit:hover { opacity: 0.88; transform: translateY(-1px); }
    .cf-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}
</script>

<script type="text/babel">
// roi-calc.jsx
function useAnimatedNumber(target, duration = 600) {
  const [display, setDisplay] = React.useState(target);
  const rafRef = React.useRef();
  const startRef = React.useRef({ from: target, ts: null });

  React.useEffect(() => {
    const from = display;
    const to = target;
    if (from === to) return;
    startRef.current = { from, to, ts: null };

    const animate = (ts) => {
      if (!startRef.current.ts) startRef.current.ts = ts;
      const elapsed = ts - startRef.current.ts;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(startRef.current.from + (startRef.current.to - startRef.current.from) * eased);
      setDisplay(current);
      if (progress < 1) rafRef.current = requestAnimationFrame(animate);
    };

    rafRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(rafRef.current);
  }, [target]);

  return display;
}

function ROISlider({ label, value, min, max, step = 1, prefix = '', suffix = '', format, onChange }) {
  const displayVal = format ? format(value) : `${prefix}${value.toLocaleString()}${suffix}`;
  const pct = ((value - min) / (max - min)) * 100;

  return (
    <div style={{ marginBottom: 24 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
        <label style={{ fontSize: 13, fontWeight: 500, color: '#94A3B8', letterSpacing: '-0.01em' }}>{label}</label>
        <span style={{ fontSize: 15, fontWeight: 700, color: '#F8FAFC', letterSpacing: '-0.03em', fontFamily: 'Inter,sans-serif' }}>{displayVal}</span>
      </div>
      <div style={{ position: 'relative' }}>
        <div style={{
          position: 'absolute', height: 4, borderRadius: 2, top: '50%', transform: 'translateY(-50%)',
          left: 0, width: pct + '%',
          background: 'linear-gradient(90deg,#6366F1,#7C3AED)',
          pointerEvents: 'none', zIndex: 1,
        }} />
        <input
          type="range" min={min} max={max} step={step} value={value}
          onChange={e => onChange(+e.target.value)}
          style={{ width: '100%', position: 'relative', zIndex: 2 }}
        />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}>
        <span style={{ fontSize: 10.5, color: '#334155' }}>{prefix}{min.toLocaleString()}{suffix}</span>
        <span style={{ fontSize: 10.5, color: '#334155' }}>{prefix}{max.toLocaleString()}{suffix}</span>
      </div>
    </div>
  );
}

/* ── hooks ── */
function useScrollEffects() {
  React.useEffect(() => {
    const bar = document.getElementById('pbar');
    const nav = document.getElementById('main-nav');
    const handle = () => {
      const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      bar.style.width = pct + '%';
      nav.classList.toggle('scrolled', window.scrollY > 40);
    };
    window.addEventListener('scroll', handle, { passive: true });
    return () => window.removeEventListener('scroll', handle);
  }, []);

  React.useEffect(() => {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const d = parseInt(e.target.dataset.delay || 0);
        setTimeout(() => e.target.classList.add('vis'), d);
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fi').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ── Contact Form ── */
function ContactForm() {
  const [fields, setFields] = React.useState({ name:'', email:'', need:'', message:'' });
  const [errors, setErrors] = React.useState({});
  const [status, setStatus] = React.useState('idle');
  const set = k => e => setFields(f => ({...f,[k]:e.target.value}));
  const validate = () => {
    const e = {};
    if (!fields.name.trim()) e.name = true;
    if (!fields.email.match(/\S+@\S+\.\S+/)) e.email = true;
    if (!fields.need) e.need = true;
    return e;
  };
  const submit = ev => {
    ev.preventDefault();
    const e = validate(); setErrors(e);
    if (Object.keys(e).length) return;
    setStatus('loading');
    setTimeout(() => setStatus('success'), 1500);
  };
  if (status === 'success') return (
    <div className="cf-success">
      <div className="cf-success-ring">✓</div>
      <h3>You're in the queue.</h3>
      <p>We'll reach out within one business day to schedule a 30-minute discovery call.</p>
    </div>
  );
  const err = k => errors[k] ? 'cf-err' : '';
  return (
    <form onSubmit={submit} noValidate className="cform-body">
      <div className="cf-row">
        <div className="cf-group">
          <label>Your Name</label>
          <input className={err('name')} placeholder="Jane Smith" value={fields.name} onChange={set('name')} />
        </div>
        <div className="cf-group">
          <label>Work Email</label>
          <input className={err('email')} type="email" placeholder="jane@company.com" value={fields.email} onChange={set('email')} />
        </div>
      </div>
      <div className="cf-group">
        <label>What do you need built?</label>
        <select className={err('need')} value={fields.need} onChange={set('need')}>
          <option value="">Select a category…</option>
          <option>Internal Tool / Dashboard</option>
          <option>Document Workflow &amp; E-signing</option>
          <option>Booking &amp; Scheduling System</option>
          <option>AI-Powered Application</option>
          <option>Something custom</option>
        </select>
      </div>
      <div className="cf-group">
        <label>Describe the problem (optional)</label>
        <textarea placeholder="What's the bottleneck? What's taking too long?" value={fields.message} onChange={set('message')} />
      </div>
      <button className="cf-submit" type="submit" disabled={status==='loading'}>
        {status==='loading' ? 'Sending…' : 'Send Message →'}
      </button>
      <p className="cf-note">No pressure. No spam. Just a conversation about your workflow.</p>
      <div className="cf-or"><div className="cf-or-line"></div><div className="cf-or-text">or</div><div className="cf-or-line"></div></div>

  );
